[package]
name = "moonsplice-tabicl"
version = "0.1.0"
edition = "2021"
description = "TabICLv2 in Candle: tablua's move ranker, run inside Moonsplice (host.tabicl)"
license = "MIT"

[lib]
name = "moonsplice_tabicl"
path = "src/lib.rs"

[[bin]]
name = "moonsplice-tabicl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
