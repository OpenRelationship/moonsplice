[package]
name = "moonsplice-play"
version = "0.1.0"
edition = "2021"
description = "Play a Moonsplice game: Bevy owns the window and the input, the engine runs the comp"
license = "MIT"

[[bin]]
name = "moonsplice-play"
path = "src/main.rs"

[dependencies]
moonsplice-engine = { path = "../engine" }
serde_json = "1"
bevy = { version = "=0.19.1", default-features = false, features = [
  "std", "multi_threaded", "default_app", "default_platform",
  "bevy_winit", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_image",
] }
